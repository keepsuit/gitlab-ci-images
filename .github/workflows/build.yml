name: build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # legacy cappuc/gitlab-ci-laravel tags are kept for existing projects (php + php-browsers only)
      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: ./images/php
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,scope=php-${{ matrix.php }},mode=min
          push: true
          tags: |
            keepsuit/gitlab-ci-php:${{ matrix.php }}
            cappuc/gitlab-ci-laravel:php${{ matrix.php }}

  php-browsers:
    runs-on: ubuntu-latest
    needs: [php]

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # legacy cappuc/gitlab-ci-laravel tags are kept for existing projects (php + php-browsers only)
      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: ./images/php
          file: ./images/php/browsers.Dockerfile
          build-args: |
            BASE_IMAGE=keepsuit/gitlab-ci-php:${{ matrix.php }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=php-browsers-${{ matrix.php }}
          cache-to: type=gha,scope=php-browsers-${{ matrix.php }},mode=min
          push: true
          tags: |
            keepsuit/gitlab-ci-php:${{ matrix.php }}-browsers
            cappuc/gitlab-ci-laravel:php${{ matrix.php }}-browsers
